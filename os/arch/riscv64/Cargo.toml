[package]
name = "riscv64"
version = "0.1.0"
edition = "2021"

[features]
default = ["virt"]
virt = []
board = []

[dependencies]
bitflags = "2"
buddy_system_allocator = "0.9"
lazy_static = { version = "1.5", features = ["spin_no_std"] }
log = "0.4"
riscv = "0.11"
spin = "0.9"
virtio-drivers = "0.7"
zerocopy = "0.7"
